<main id="main"><noscript><h1>Finora: free money tracker</h1><p>Meet Fin, your finance buddy. Track income and spending, set budgets, build savings goals use calculators (SIP, EMI, FD, retirement) and learn money basics like the 50/30/20 rule and emergency funds. Enable JavaScript to use Finora. Your data stays in your browser.</p></noscript></main>

c:v=>{v.y=Math.min(v.y,60);const a=sipFV(v.p,v.r,v.y,v.s,v.l),d=v.y>3?sipFV(v.p,v.r,v.y-3,v.s,v.l):null;return{big:['Estimated value',fmt(a.b)],rows:[['Total invested',fmt(a.i)],['Estimated gains',fmt(a.b-a.i),'pos'],['Wealth multiple',(a.i?a.b/a.i:0).toFixed(2)+'×']],chart:lc([{n:'Value',c:'var(--cyan)',d:a.ys},{n:'Invested',c:'var(--vio)',d:a.iv}],['Today','Year '+v.y]),fin:d?`Starting 3 years late would cost you about ${fmt(a.b-d.b)} at the end. Time in the market matters.`:''}}},
emi:{n:'Loan EMI calculator',f:[['p','Loan amount (₹)',2500000],['r','Interest rate (% a year)',8.5],['y','Tenure (years)',20],['x','Extra monthly prepayment (₹)',0]],
c:v=>{v.y=Math.min(v.y,40);const P=v.p,r=v.r/1200,n=Math.max(1,Math.round(v.y*12)),e=r?P*r*pw(1+r,n)/(pw(1+r,n)-1):P/n,sim=x=>{let b=P,m=0,t=0;while(b>.5&&m<1200){const i=b*r,q=e+x-i;if(q<=0)break;t+=i;b-=Math.min(b,q);m++}return{m,t}},a=sim(0),b=sim(v.x);return{big:['Monthly EMI',fmt(e)],rows:[['Total interest',fmt(a.t)],['Total payment',fmt(P+a.t)],...(v.x>0?[['Finish earlier by',(a.m-b.m)+' months','pos'],['Interest saved',fmt(a.t-b.t),'pos']]:[])],chart:dn(P,a.t,'Principal','Interest','var(--cyan)','var(--pink)'),fin:a.t>P?'You’ll pay more in interest than you borrowed. A small monthly prepayment can cut years off.':v.x>0?'':'Try an extra monthly prepayment above to see how much interest you can save.'}}},
fd:{n:'FD / RD calculator',f:[['p','Lump sum (₹)',100000],['d','Monthly deposit (₹)',0],['r','Interest rate (% a year)',7],['y','Years',5],['f','Compounding per year',4]],
c:v=>{v.y=Math.min(Math.ceil(v.y),50);const f=Math.max(1,v.f),rm=pw(1+v.r/100/f,f/12)-1,val=t=>v.p*pw(1+v.r/100/f,f*t)+(rm?v.d*(pw(1+rm,12*t)-1)/rm*(1+rm):v.d*12*t),inv=t=>v.p+v.d*12*t,ys=[],iv=[];for(let t=0;t<=v.y;t++){ys.push(val(t));iv.push(inv(t))}const T=val(v.y),I=inv(v.y);return{big:['Maturity value',fmt(T)],rows:[['Total invested',fmt(I)],['Interest earned',fmt(T-I),'pos'],['Effective yearly yield',((pw(1+v.r/100/f,f)-1)*100).toFixed(2)+'%']],chart:lc([{n:'Value',c:'var(--cyan)',d:ys},{n:'Invested',c:'var(--vio)',d:iv}],['Today','Year '+v.y]),fin:''}}},
goal:{n:'Goal planner',f:[['t','Goal amount in today’s prices (₹)',1000000],['y','Years to goal',10],['r','Expected return (% a year)',12],['i','Inflation (% a year)',6],['e','Already saved (₹)',0]],
c:v=>{v.y=Math.max(1,Math.min(v.y,60));const n=v.y*12,r=v.r/1200,ft=v.t*pw(1+v.i/100,v.y),ex=v.e*pw(1+r,n),need=Math.max(0,ft-ex),sip=r?need*r/((pw(1+r,n)-1)*(1+r)):need/n,inv=sip*n+v.e;return{big:['Monthly SIP needed',fmt(sip)],rows:[['Goal in future rupees',fmt(ft)],['Savings so far will grow to',fmt(ex)],['You invest in total',fmt(inv)]],chart:dn(Math.min(inv,ft),Math.max(0,ft-inv),'Your money','Market growth','var(--vio)','var(--cyan)'),fin:`Because of inflation, ${fmt(v.t)} today needs ${fmt(ft)} in ${v.y} years.`}}},
ret:{n:'Retirement planner',f:[['a','Current age',25],['b','Retirement age',55],['m','Monthly expenses today (₹)',40000],['i','Inflation (% a year)',6],['r','Expected return (% a year)',12],['e','Already saved (₹)',0]],
c:v=>{const y=Math.max(1,v.b-v.a),n=y*12,r=v.r/1200,fe=v.m*12*pw(1+v.i/100,y),corp=fe*25,ex=v.e*pw(1+r,n),need=Math.max(0,corp-ex),sip=r?need*r/((pw(1+r,n)-1)*(1+r)):need/n;return{big:['Corpus needed at '+v.b,fmt(corp)],rows:[['Yearly spending then',fmt(fe)],['Monthly SIP needed',fmt(sip),'pos'],['Years to invest',String(y)]],chart:dn(Math.min(ex,corp),Math.max(0,corp-ex),'Existing savings','Still to build','var(--lime)','var(--pink)'),fin:'Uses the 4% rule: a corpus 25× your yearly spending. A rough guide, not a guarantee.'}}},
infl:{n:'Inflation calculator',f:[['a','Amount today (₹)',100000],['i','Inflation (% a year)',6],['y','Years',10]],
c:v=>{v.y=Math.min(Math.ceil(v.y),60);const ys=[],pv=[];for(let t=0;t<=v.y;t++){ys.push(v.a*pw(1+v.i/100,t));pv.push(v.a/pw(1+v.i/100,t))}return{big:['The same things will cost',fmt(ys[v.y])],rows:[['Your '+fmt(v.a)+' will buy only',fmt(pv[v.y]),'pos'],['Loss of buying power',(100-100/pw(1+v.i/100,v.y)).toFixed(0)+'%']],chart:lc([{n:'Cost of same things',c:'var(--pink)',d:ys},{n:'Value of your money',c:'var(--cyan)',d:pv}],['Today','Year '+v.y]),fin:'Idle cash loses value every year. Your savings need to earn more than inflation.'}}}};
const toolUI=()=>{const T=TL[tl];return `<div class="split"><section class="card"><h2>${T.n}</h2>${T.f.map(([k,l,d])=>`<label class="fld"><span>${l}</span><input id="t_${k}" type="number" inputmode="decimal" min="0" step="any" value="${esc(TV[tl+k]??d)}" oninput="tc()"></label>`).join('')}${tl==='sip'?`<button class="chip" onclick="TV.sipp=Math.max(0,Math.round(stats().inc-stats().exp));render(1)">Use my monthly surplus</button>`:''}</section><section class="card" id="tr"></section></div>`};
function tc(){const T=TL[tl],v={};T.f.forEach(([k])=>{const e=$('#t_'+k),x=+e.value;v[k]=isFinite(x)&&x>=0?x:0;TV[tl+k]=e.value});const o=T.c(v);$('#tr').innerHTML=`<div class="mute">${o.big[0]}</div><div class="big">${o.big[1]}</div><div style="margin-top:10px">${o.rows.map(([l,x,c])=>`<div class="bl"><span class="mute">${l}</span><b class="${c||''}">${x}</b></div>`).join('')}</div><div style="margin-top:14px">${o.chart}</div>${o.fin?`<div class="ins good" style="margin-top:14px"><b>Fin’s take</b><span>${o.fin}</span></div>`:''}<p class="mute" style="margin:12px 0 0">Illustrative estimates only, not guaranteed returns or professional advice.</p>`}
V.tools=()=>`<h1>Tools</h1><div class="chips scroll">${[['calc','Calculator'],['sip','SIP'],['emi','Loan EMI'],['fd','FD / RD'],['goal','Goal planner'],['ret','Retirement'],['infl','Inflation']].map(([k,l])=>`<button class="chip ${tl===k?'on':''}" onclick="tl='${k}';render(1)">${l}</button>`).join('')}</div>${tl==='calc'?calcUI():toolUI()}`;
const trend=()=>{const m=iso().slice(0,7),ms=[5,4,3,2,1,0].map(i=>addM(m,-i)),d=ms.map(x=>stats(x)),mx=Math.max(1,...d.map(x=>Math.max(x.inc,x.exp)));return `<section class="card"><h2>Last 6 months</h2><svg viewBox="0 0 300 126" width="100%" role="img" aria-label="Income and spending for the last six months">${d.map((x,i)=>{const a=x.inc/mx*84,b=x.exp/mx*84,X=i*50+6;return `<rect x="${X}" y="${94-a}" width="18" height="${Math.max(a,1)}" rx="4" fill="var(--lime)"/><rect x="${X+20}" y="${94-b}" width="18" height="${Math.max(b,1)}" rx="4" fill="var(--pink)"/><text x="${X+19}" y="112" text-anchor="middle" font-size="10" fill="var(--mute)">${new Date(ms[i]+'-01T00:00').toLocaleString('en',{month:'short'})}</text>`}).join('')}</svg><div class="legend" style="flex-direction:row;gap:16px"><span><i class="dt" style="background:var(--lime)"></i>Income</span><span><i class="dt" style="background:var(--pink)"></i>Spent</span></div></section>`};
function render(k){if(view==='home')TP=tipsNow();
const n=TABS.map(([v,e,l])=>`<button class="tab" ${v===view?'aria-current="page"':''} onclick="go('${v}')"><b>${e}</b>${l}</button>`);
$('#nav').innerHTML='<span class="logo sl">Finora</span>'+n.slice(0,2).join('')+'<button class="fab" aria-label="Add transaction" onclick="openAdd()">+<span class="fl">Add transaction</span></button>'+n.slice(2).join('');
$('#main').innerHTML=V[view]();document.title=(view==='home'?'':TABS.find(t=>t[0]===view)[2]+' · ')+'Finora – Free Money Tracker';
if(view==='tools'){tl==='calc'?drawCalc():tc()}if(!k)window.scrollTo(0,0)}
function go(v){view=v;location.hash=v;render()}
onhashchange=()=>{const h=location.hash.slice(1);if(V[h]&&h!==view){view=h;render()}};
onkeydown=e=>{if(e.key==='Escape'){closeSheet();return}if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName||'')||$('#sheet').innerHTML||e.ctrlKey||e.metaKey||e.altKey)return;
if(view==='tools'&&tl==='calc'){const m={'*':'×','/':'÷','-':'−',Enter:'=','=':'=',Backspace:'⌫',c:'C',C:'C'},k=m[e.key]||(/^[0-9+.()%^]$/.test(e.key)?e.key:'');if(k){e.preventDefault();press(k);snd('tap')}return}
if(e.key==='n'){openAdd();snd('open')}else if(/^[1-5]$/.test(e.key))go(TABS[e.key-1][0])};
function openAdd(k='expense',c){add={k,c:c||(k==='expense'?'food':'salary'),w:'t',a:'',n:''};drawSheet();$('#amt').focus()}
function drawSheet(keep){if(keep){add.a=$('#amt').value;add.n=$('#note').value}const L=add.k==='expense'?EX:IN;
$('#sheet').innerHTML=`<div class="scrim" onclick="closeSheet()"></div><div class="sheet" role="dialog" aria-label="Add transaction"><div class="seg"><button class="${add.k==='expense'?'on':''}" onclick="add.k='expense';add.c='food';drawSheet(1)">Spent</button><button class="${add.k==='income'?'on inc':''}" onclick="add.k='income';add.c='salary';drawSheet(1)">Earned</button></div>
<input id="amt" class="amt" type="number" inputmode="decimal" placeholder="₹0" aria-label="Amount" value="${esc(add.a)}" onkeydown="if(event.key==='Enter')saveTx()">
<div class="cats">${L.map(([k,e,c])=>`<button class="cat ${k===add.c?'on':''}" style="--c:${c}" onclick="add.c='${k}';drawSheet(1)"><i class="dt" style="background:${c}"></i><span>${k}</span></button>`).join('')}</div>
<input id="note" placeholder="Add a note (optional)" aria-label="Note" value="${esc(add.n)}">
<div class="chips" style="margin:0">${[['t','Today'],['y','Yesterday'],['d','Every day'],['m','Every month']].map(([k,l])=>`<button class="chip ${add.w===k?'on':''}" onclick="add.w='${k}';drawSheet(1)">${l}</button>`).join('')}</div>
<button class="go" onclick="saveTx()">Save</button></div>`}
function closeSheet(){$('#sheet').innerHTML=''}
function saveTx(){const a=+$('#amt').value;if(!(a>0)){snd('warn');toast('Enter an amount first, then tap Save.');return}
snd('ok');const rp=add.w==='d'||add.w==='m',t={id:uid(),date:iso(add.w==='y'?1:0),kind:add.k,cat:add.c,amount:a,note:$('#note').value.trim(),rid:rp?uid():'',freq:rp?add.w:''};S.tx.push(t);applyRec();save();closeSheet();TP=tipsNow();ti=0;render(1);toast(react(t));if(rw){rw=0;setTimeout(()=>snd('warn'),160)}}
function react(t){const{cats,exp,inc}=stats();if(t.kind==='income')return `Income of ${fmt(t.amount)} recorded. Consider moving 20% to savings right away.`;const b=S.bud[t.cat];if(b){const p=Math.round((cats[t.cat]||0)/b*100);rw=p>100;return p>100?`Recorded. ${cap(t.cat)} is now ${p}% of its budget. Consider pausing it this month.`:`Recorded. ${p}% of your ${t.cat} budget is used.`}return inc?`Recorded. You have ${fmt(inc-exp)} left this month.`:RX[Math.floor(Math.random()*RX.length)]}
function del(i){const d=S.tx.find(x=>x.id===i);S.tx=S.tx.filter(x=>d&&d.rid?x.rid!==d.rid:x.id!==i);save();render(1)}
function addBud(){const l=+$('#bl').value;if(l>0){S.bud[$('#bc').value]=l;save();render(1);toast('Budget saved. I’ll track it for you.')}}
function delBud(c){delete S.bud[c];save();render(1)}
function autoBud(q){const{inc}=stats();if(!inc){toast('Add your income first and I’ll plan around it.');return}Object.entries({food:.15,transport:.08,bills:.1,fun:.1,shopping:.07}).forEach(([c,p])=>S.bud[c]=Math.max(100,Math.round(inc*p/100)*100));save();if(!q){render(1);toast('Smart budgets are set. Tweak them anytime.')}}
function addGoal(){const n=$('#gn').value.trim(),t=+$('#gt').value;if(n&&t>0){S.goals.push({id:uid(),name:n,target:t,saved:0});save();render(1);toast('Goal created.')}}
function delGoal(i){S.goals=S.goals.filter(g=>g.id!==i);save();render(1)}
function addG(i,a){const g=S.goals.find(x=>x.id===i);g.saved+=a;save();render(1);toast(g.saved>=g.target?`Goal reached: ${g.name} is fully funded.`:`${fmt(a)} added to ${g.name}.`)}
function dl(t){const b=t==='csv'?['date,type,category,amount,note',...S.tx.map(x=>[x.date,x.kind,x.cat,x.amount,'"'+(x.note||'').replace(/"/g,'""')+'"'].join(','))].join('\n'):JSON.stringify(S);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'text/'+t}));a.download='finora.'+t;a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.tx&&d.goals){S={bud:{},name:'Friend',...d};save();render()}}catch(e){}};r.readAsText(f)}
let SND=true,AC,rw=0;try{SND=localStorage.getItem('finora-snd')!=='0'}catch(e){}
const SN={tap:[[1250,0,.04,.045]],open:[[440,0,.09,.05],[660,.05,.1,.04]],ok:[[660,0,.09,.05],[990,.08,.15,.045]],warn:[[300,0,.12,.06],[235,.09,.17,.05]],del:[[420,0,.08,.04],[300,.05,.1,.04]]};
function snd(k='tap'){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;SN[k].forEach(([f,d0,d,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d0);g.gain.exponentialRampToValueAtTime(v,t+d0+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d0+d);o.connect(g);g.connect(AC.destination);o.start(t+d0);o.stop(t+d0+d+.03)})}catch(e){}}
addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button,summary,label.chip');if(!b)return;const o=b.getAttribute('onclick')||'';if(/saveTx/.test(o))return;snd(/del|wipe/.test(o)?'del':/openAdd/.test(o)?'open':/addBud|addGoal|addG\(/.test(o)?'ok':'tap')},true);
function toggleSnd(){SND=!SND;try{localStorage.setItem('finora-snd',SND?'1':'0')}catch(e){}$('#sn').setAttribute('aria-pressed',String(SND));snd('tap')}
function wipe(b){if(b.dataset.c){S={name:'',tx:[],bud:{},goals:[]};save();ob=0;ot={};view='home';closeSheet();drawOb();render();window.scrollTo(0,0)}else{b.dataset.c=1;b.textContent='Tap again to erase everything'}}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='light'?'dark':'light'}
function drawOb(){const o=$('#ob');if(S.name){o.innerHTML='';o.hidden=true;return}o.hidden=false;
const st=[`<h2>Welcome to Finora</h2><p>I’m Fin, your money advisor. I track your spending, analyse your habits and suggest next steps. What should I call you?</p><input id="o1" maxlength="20" placeholder="Your name" aria-label="Your name" autocomplete="given-name" onkeydown="if(event.key==='Enter')obn(1)"><button class="go" onclick="obn(1)">Continue</button><button class="chip" style="align-self:center" onclick="demo()">Try with sample data</button>`,
`<h2>Hello, ${esc(ot.n||'')}</h2><p>Roughly how much do you earn each month? I use it to show what’s left to spend.</p><input id="o2" type="number" inputmode="decimal" placeholder="e.g. 50000" aria-label="Monthly income" onkeydown="if(event.key==='Enter')obn(2)"><button class="go" onclick="obn(2)">Continue</button><button class="chip" style="align-self:center" onclick="obn(2,1)">Skip for now</button>`,
`<h2>Want a head start?</h2><p>I can set smart budgets and an emergency fund goal for you. You can change everything later.</p><button class="go" onclick="obn(3,0)">Yes, set me up</button><button class="chip" style="align-self:center" onclick="obn(3,1)">I’ll do it myself</button>`];
o.innerHTML=`<div class="obc">${fin(120)}${st[ob]}</div>`;const f=o.querySelector('input');if(f)f.focus()}
function obn(s,skip){if(s===1){const n=$('#o1').value.trim();if(!n){$('#o1').focus();return}ot.n=n;ob=1;drawOb()}
else if(s===2){const v=+$('#o2').value;if(!skip&&v>0)ot.inc=v;ob=2;drawOb()}
else{S.name=ot.n;if(ot.inc){S.tx.push({id:uid(),date:iso(),kind:'income',cat:'salary',amount:ot.inc,note:'Monthly income',rid:uid(),freq:'m'});if(!skip){autoBud(1);S.goals.push({id:uid(),name:'Emergency fund',target:ot.inc*3,saved:0})}}save();drawOb();render();toast('Setup complete. Tap + whenever you spend or earn.')}}
function demo(){S.name=ot.n||$('#o1').value.trim()||'Friend';const m=iso().slice(0,7);[['income','salary',60000],['expense','rent',18000],['expense','food',7500],['expense','transport',3200],['expense','bills',2800],['expense','fun',6500],['expense','shopping',5200]].forEach(([k,c,a],i)=>S.tx.push({id:uid(),date:m+'-0'+(i+1),kind:k,cat:c,amount:a,note:'',rid:i?'':uid()}));S.tx.push({id:uid(),date:iso(),kind:'expense',cat:'food',amount:320,note:'Lunch',rid:''});S.bud={food:8000,fun:5000,transport:4000};S.goals.push({id:uid(),name:'Emergency fund',target:180000,saved:35000},{id:uid(),name:'Goa trip',target:25000,saved:9000});save();drawOb();render()}
{const h=location.hash.slice(1);if(V[h])view=h}
applyRec();save();drawOb();render();$('#sn').setAttribute('aria-pressed',String(SND));
</script>
